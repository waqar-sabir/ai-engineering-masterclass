[project]
name = "ai-engineering-masterclass"
version = "0.1.0"
description = "Repository tooling for the 75-day AI Engineering Masterclass"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.11,<1", "pytest>=8,<10", "pyyaml>=6,<7"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests", "projects", "shared/python"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
